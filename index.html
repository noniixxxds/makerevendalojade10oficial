
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O Segredo das Lojas de R$10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                pink: '#ff007f',
                light: '#ffe6f2',
                dark: '#b30059',
                bg: '#fff0f5'
              },
              whatsapp: '#25D366'
            },
            fontFamily: {
              sans: ['Open Sans', 'sans-serif'],
              heading: ['Montserrat', 'sans-serif'],
              hand: ['Caveat', 'cursive'],
            },
            keyframes: {
              heartbeat: {
                '0%, 100%': { transform: 'scale(1) translateZ(0)', filter: 'brightness(100%)' },
                '50%': { transform: 'scale(1.05) translateZ(0)', boxShadow: '0 0 15px rgba(37, 211, 102, 0.7)', filter: 'brightness(115%)' },
              },
              'heartbeat-skew': {
                '0%, 100%': { transform: 'skewX(-12deg) scale(1) translateZ(0)' },
                '50%': { transform: 'skewX(-12deg) scale(1.05) translateZ(0)', filter: 'brightness(105%)', boxShadow: '0 0 10px rgba(255, 255, 255, 0.5)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              bounceIn: {
                '0%': { opacity: '0', transform: 'scale(0.3) translateZ(0)' },
                '50%': { opacity: '1', transform: 'scale(1.05) translateZ(0)' },
                '70%': { transform: 'scale(0.9) translateZ(0)' },
                '100%': { transform: 'scale(1) translateZ(0)' },
              }
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'heartbeat': 'heartbeat 0.8s ease-in-out infinite',
              'heartbeat-skew': 'heartbeat-skew 0.8s ease-in-out infinite',
              'fade-in': 'fadeIn 0.3s ease-out',
              'bounce-in': 'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        scroll-behavior: smooth;
        background-color: #fff0f5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .wpp-bg {
        background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
        background-color: #E5DDD5;
      }
      /* Otimização de Processamento em Tempo Real */
      .gpu-boost {
        transform: translateZ(0);
        backface-visibility: hidden;
        perspective: 1000px;
        will-change: transform, opacity;
      }
      .optimize-img {
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        content-visibility: auto;
      }
      .blur-optimized {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
